[project]
name = "react-mcp"
version = "0.1.0"
description = "A ReAct agent running on local Ollama models and talking to a Model Context Protocol (MCP) server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "ollama>=0.6.3",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
]

[project.scripts]
react-mcp = "react_mcp.cli:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exercises a real subprocess or local Ollama server",
]
